<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Movie Theater{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'movie_list' %}">&#127916; Movie Theater</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'movie_list' %}">Movies</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'booking_history' %}">My bookings</a></li>
        </ul>
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 mb-0">
            {% csrf_token %}
            <span class="navbar-text">{{ user.username }}</span>
            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Log in</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
        {{ message }}
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
